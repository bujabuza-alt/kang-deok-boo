name: 알림 서버(Cloudflare Worker) 배포

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

    steps:
      # 알림 서버를 아직 설정하지 않았다면(docs/PUSH_SETUP.md) 조용히 건너뜁니다.
      - name: 설정 확인
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$D1_DATABASE_ID" ]; then
            echo "ℹ️ CLOUDFLARE_API_TOKEN / D1_DATABASE_ID 시크릿이 없어 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: 배포
        if: steps.check.outputs.skip != 'true'
        run: |
          npm ci
          sed -i "s/D1_DATABASE_ID_PLACEHOLDER/${D1_DATABASE_ID}/" wrangler.toml
          npx wrangler d1 execute kang-deok-boo-push --remote --file=schema.sql
          npx wrangler deploy
          printf '%s' "$VAPID_PUBLIC_KEY" | npx wrangler secret put VAPID_PUBLIC_KEY
          printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY
          printf '%s' "$VAPID_SUBJECT" | npx wrangler secret put VAPID_SUBJECT
